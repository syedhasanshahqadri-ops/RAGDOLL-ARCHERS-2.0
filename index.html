 `<div class="row"><span>Bow damage Lv ${sv.dl}</span><button onclick="upg('dl')">${up('dl')} 🪙</button></div><div class="row"><span>Health Lv ${sv.hl}</span><button onclick="upg('hl')">${up('hl')} 🪙</button></div>`+

// ragdoll
function rag(a,ix,iy){const s=a.sc,B=[[0,-85],[0,-70],[0,-38],[-14,-55],[14,-55],[-8,-18],[8,-18],[-10,0],[10,0]],K=[[0,1],[1,2],[1,3],[1,4],[2,5],[2,6],[5,7],[6,8],[0,2]];
 a.rag={p:B.map(b=>({x:a.x+b[0]*s,y:a.y+b[1]*s,px:a.x+b[0]*s-ix/60,py:a.y+b[1]*s-iy/60})),k:K.map(k=>[k[0],k[1],0])};
 a.rag.k.forEach(k=>{const p=a.rag.p[k[0]],q=a.rag.p[k[1]];k[2]=Math.hypot(p.x-q.x,p.y-q.y)})}
function ragStep(a,dt){const r=a.rag;r.p.forEach(p=>{const vx=(p.x-p.px)*.99,vy=(p.y-p.py)*.99;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+1500*dt*dt});
 for(let i=0;i<5;i++){r.k.forEach(k=>{const p=r.p[k[0]],q=r.p[k[1]],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,f=(d-k[2])/d*.5;p.x+=dx*f;p.y+=dy*f;q.x-=dx*f;q.y-=dy*f});
  r.p.forEach(p=>{if(Math.abs(p.x-a.x)<115&&p.y>a.y){p.y=a.y;p.px+=(p.x-p.px)*.35}})}}
// effects
function burst(x,y,c,n=10,sp=200){for(let i=0;i<n;i++){const t=R(0,6.28),v=R(.2,1)*sp;PT.push({x,y,vx:Math.cos(t)*v,vy:Math.sin(t)*v-60,l:R(.3,.8),m:.8,c,r:R(2,5)})}}

function mult(a){return a.side?1+lvl*.03*(mode!=2):1+sv.dl*.12+(sv.mastery||0)*.06}
function hurt(a,d,hx,hy,ix=0,iy=0){if(a.dead)return;if(a.shield){a.shield=0;pop(a.x,a.y-150,'SHIELD BLOCK!','#6fe3ff');burst(a.x,a.y-50,'#6fe3ff',14,180);return}a.hp-=d;a.flash=.15;if(a.hp<=0){a.hp=0;die(a,ix,iy)}}
function die(a,ix,iy){a.dead=1;rag(a,ix*.5,iy*.5-120);shake=14;snd(120,.4,'sawtooth',.1);bleed(a.x,a.y-60,ix,iy,70);a.bl=4;tsc=.3;setTimeout(()=>tsc=1,900);endT=0;
 if(mode==2)res=a.side?'p1':'p2';else if(a.side){kills++;if(mode==0){const old=lvl;lvl=Math.max(1,Math.floor((Math.sqrt(8*(kills+1)+1)-1)/2));if(lvl>old)pop(W/2,170,'LEVEL '+lvl+' UNLOCKED!','#ffd166')}res='win';sv.coins+=mode==0?20+lvl*5+(E.boss?100:0):15;sv.best=Math.max(sv.best,mode==0?lvl:kills);save()}else{res='lose';sv.best=Math.max(sv.best,mode==0?lvl:kills);save()}}
function shoot(a,ty,pw,th){const s=a.side?-1:1,v=pw*1150*(ty==3?1.15:1),n=ty==4?3:1;
 for(let i=0;i<n;i++){const t=th+(n>1?(i-1)*.07:0);AS.push({x:a.x+s*22*Math.cos(t),y:a.y-62*a.sc-22*Math.sin(t),vx:s*Math.cos(t)*v,vy:-Math.sin(t)*v,ty,o:a.side,tr:[],g:ty==3?.3:1,m:mult(a)*(a.st<=0?.6:1)})}
 a.st=Math.max(0,a.st-(ty==4?12:7));if(!a.side){sv.shots=(sv.shots||0)+1;save()}a.rec=.5;a.kick=.12;snd(260+ty*40,.1,'triangle');if(mode==2)wait=1}
function solve(a,t,err){for(let k=0;k<6;k++){const th=R(.45,1.05),d=Math.abs(t.x-a.x),dy=(t.y-70)-(a.y-62),den=2*Math.cos(th)**2*(d*Math.tan(th)+dy);if(den<=0)continue;let v=Math.sqrt(G*d*d/den);if(v>1150)continue;return{th:th+R(-err,err)*.4,pw:Math.min(1,v*(1+R(-err,err))/1150)}}return{th:.8,pw:.9}}
function aiShoot(){if(!E.pre)aiPre();const s=E.pre;E.pre=0;E.ang=s.th;shoot(E,E.nt,s.pw*pwcap(E),s.th);E.cool=Math.max(.9,R(1.4,2.8)-lvl*.03)*(E.boss?.8:1)}
function upd(dt){if(pause)return;T+=dt;shake*=.9;if(st!='play')return;const as=[P,E];
 as.forEach(a=>{a.rec-=dt;a.flash-=dt;a.kick-=dt;if(a.dead&&a.bl>0){a.bl-=dt;a.pool=Math.min(70,a.pool+dt*18);if(Math.random()<.5&&a.rag){const q=a.rag.p[Math.random()*9|0];bleed(q.x,q.y,0,1,1)}}if(!a.dead){if(!(drag&&act()===a))a.st=Math.min(100,a.st+(9+(sv.stamina||0)*2)*dt);{const h=Math.min(a.rh,14*dt),q=Math.min(a.rs,14*dt);a.rh-=h;a.rs-=q;a.hp=Math.min(a.max,a.hp+h);a.st=Math.min(100,a.st+q)}if(a.hp<a.max*.35&&Math.random()<.12)bleed(a.x,a.y-55*a.sc,0,1,1);if(a.burn>0){a.burn-=dt;hurt(a,6*dt);if(Math.random()<.3)burst(a.x,a.y-50,'#ff9a3c',1,60)}if(a.pois>0){a.pois-=dt;hurt(a,4*dt);if(Math.random()<.2)burst(a.x,a.y-60,'#8be04a',1,40)}}});
 fruitUpd(dt);if(mode!=2&&!E.dead&&!P.dead){E.cool-=dt*(E.st<15?.6:1);if(E.cool<.9&&!E.pre)aiPre();if(E.pre){const k=Math.min(1,dt*6);E.ang+=(E.pre.th-E.ang)*k;E.pw+=(E.pre.pw-E.pw)*k}if(E.cool<=0)aiShoot()}
 acc+=dt;while(acc>=1/60){as.forEach(a=>a.dead&&a.rag&&ragStep(a,1/60));acc-=1/60}
 for(const a of AS){for(let i=0;i<3&&!a.x_;i++){const h=dt/3;a.vy+=G*a.g*h;a.vx+=wind*a.g*h;a.x+=a.vx*h;a.y+=a.vy*h;a.tr.push([a.x,a.y]);if(a.tr.length>14)a.tr.shift();
  const t=a.o?P:E;if(!t.dead){const s=t.sc,hd=Math.hypot(a.x-t.x,a.y-(t.y-84*s))<16*s,bd=Math.abs(a.x-t.x)<16*s&&a.y>t.y-72*s&&a.y<t.y;
   if(hd||bd){hit(a,t,hd);break}}
  if(FR&&Math.hypot(a.x-FR.x,a.y-FR.y)<30){grab(a);a.x_=1;break}
  for(const q of [P,E])if(Math.abs(a.x-q.x)<110&&a.y>q.y&&a.y<q.y+300){if(a.ty==5)boom(a);else{burst(a.x,a.y,'#cbb',4,80);a.x_=1;if(!a.o)combo=0}}
  if(a.y>H+80||a.x<-50||a.x>W+50)a.x_=1}}
 if(AS.some(a=>a.x_)){AS=AS.filter(a=>!a.x_)}
 if(wait&&!AS.length){wait=0;turn^=1}
 PT=PT.filter(p=>(p.l-=dt)>0);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.b?900:400)*dt;if(p.b)for(const q of [P,E])if(Math.abs(p.x-q.x)<118&&p.y>=q.y-3&&p.y<q.y+40){ST.length<300&&ST.push({x:p.x,y:q.y+R(-3,4),r:p.r*R(.8,1.6),w:R(1.4,2.4)});p.l=0;break}});TX=TX.filter(t=>(t.l-=dt)>0);TX.forEach(t=>t.y-=40*dt);
 if(res){endT+=dt;if(endT>1.7)finish()}}
function hit(a,t,hd){const d=AR[a.ty].d*a.m*(hd?2.2:1);hurt(t,d,0,0,a.vx,a.vy);pop(t.x,t.y-110*t.sc,Math.round(d)+(hd?' HEADSHOT!':''),hd?'#ffd166':'#fff');snd(hd?900:500,.1,'square',.06);bleed(a.x,a.y,a.vx,a.vy,hd?32:16);{const o=a.o?E:P;o.st=Math.max(0,o.st-3)}if(!a.o){combo++;if(combo>2){sv.highCombo=Math.max(sv.highCombo||0,combo);sv.ach=Math.max(sv.ach||0,combo>=5?1:0);sv.coins++;pop(t.x,t.y-150,'COMBO x'+combo,'#6fe3ff')}}
 if(a.ty==1)t.burn=3;if(a.ty==2)t.pois=5;if(a.ty==3){burst(t.x,t.y-60,'#6fe3ff',20,300);shake=8}if(a.ty==5)boom(a);a.x_=1}
function boom(a){a.x_=1;shake=16;snd(80,.4,'sawtooth',.12);burst(a.x,a.y,'#ff9a3c',30,320);burst(a.x,a.y,'#ffd166',16,200);const t=a.o?P:E;if(!t.dead&&Math.hypot(t.x-a.x,t.y-60-a.y)<110){const d=AR[5].d*a.m;hurt(t,d,0,0,a.vx*.3,a.vy*.3);pop(t.x,t.y-110,Math.round(d),'#ff9a3c')}}
function finish(){st='end';res0=res;const r=res;

 else ui(`<h1>${r=='p1'?'Player 1':'Player 2'} Wins!</h1><button onclick="start(2)">Rematch</button><button onclick="menu()">Menu</button>`)}
